name: Build EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: cl /EHsc /O2 /std:c++17 /utf-8 /Fe:AhmadHashoum_Upscaler.exe main.cpp /link /SUBSYSTEM:WINDOWS
      - uses: actions/upload-artifact@v4
        with:
          name: AhmadHashoum_Upscaler
          path: AhmadHashoum_Upscaler.exe
